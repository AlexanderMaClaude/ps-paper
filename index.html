<script>
  /* ══════════════════════════════════════════════════════════════════════
     HOW THIS PAGE BECOMES THE PAPER
     ──────────────────────────────────────────────────────────────────────
     You do not have to do anything. On every visit this page asks Crossref
     whether the paper has been published yet. The moment it has, visitors
     are sent straight to it. Until then they see this landing page.

     MANUAL OVERRIDE: if you'd rather not wait for Crossref (or the title
     changed), paste the real DOI into the DOI line below and commit; it wins
     immediately. Empty is safe — nobody is ever sent to a placeholder link.
     (No example DOI is written here on purpose: a plausible-looking fake one
     is too easy to copy by accident, and it would redirect every visitor to
     a dead link.)
     ═════════════════════════════════════════════════════════════════════ */
  const DOI   = "";
  const TITLE = "Discovery of natural RNA phosphorothioates and their writer machinery";
  const AUTHOR = "krayn";

  const go = d => location.replace("https://doi.org/" + d);

  if (DOI) {
    go(DOI);
  } else {
    /* Ask Crossref if it exists yet. Any failure (offline, slow conference
       wifi, no match) silently leaves the landing page up — fail-safe. */
    const norm  = s => (s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    const score = (a, b) => {
      const A = new Set(norm(a).split(" ")), B = new Set(norm(b).split(" "));
      let hit = 0; A.forEach(w => { if (B.has(w)) hit++; });
      return hit / Math.max(A.size, B.size, 1);
    };

    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 2500);

    fetch("https://api.crossref.org/works?rows=5&mailto=alex.a.maman@gmail.com"
          + "&query.bibliographic=" + encodeURIComponent(TITLE),
          { signal: ctl.signal })
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(data => {
        /* Strict match: near-identical title AND an author named Krayn.
           Both must agree before we ever redirect someone. */
        const match = (data.message.items || []).find(it =>
          score((it.title || [])[0], TITLE) >= 0.75 &&
          (it.author || []).some(a => norm(a.family) === AUTHOR)
        );
        if (match) go(match.DOI);
      })
      .catch(() => {})
      .finally(() => clearTimeout(timer));
  }
</script>
